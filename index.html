<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>form-validation</title>
  <link href="css/style.css" rel="stylesheet" />
  <script defer src="scripts/script.js"></script>
</head>

<body>
  <h1>form-validation-practice</h1>

  <div id="form-card">
    <form id="my-form" novalidate>
      <label for="email">e-mail</label>
      <input id="email" name="email" type="email" placeholder="example@brand.com" required/>

      <label for="country">country</label>
      <input id="country" name="country" type="text" placeholder="Brazil" />

      <label for="postal-code">postal code</label>
      <input id="postal-code" name="postal-code" type="text" placeholder="12345-1234" />

      <label for="password">password</label>
      <input id="password" name="password" type="password" />

      <label for="password">confirm password</label>
      <input id="confirm" name="confirm" type="password" />
    </form>
    <button type="submit" form="my-form">submit</button>
  </div>
</body>

</html>
